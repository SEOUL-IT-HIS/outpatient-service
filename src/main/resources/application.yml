server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  api:
    host: localhost
    port: ${server.port}
    base-url: http://${app.api.host}:${server.port}
    endpoints:
      outpatient: /api/outpatient
      health: /api/outpatient/health
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://192.168.*:*
  service:
    code: OPD
    name: outpatient-service
  services:
    patient:
      base-url: ${PATIENT_BASE_URL:http://localhost:8082}
      # true면 PAT 미기동 로컬 stub. 실제 연동 시 false
      stub-enabled: ${PATIENT_STUB_ENABLED:true}
    admin:
      base-url: ${ADMIN_BASE_URL:http://localhost:8083}
      stub-enabled: ${ADMIN_STUB_ENABLED:true}
    lab:
      base-url: ${LAB_BASE_URL:http://localhost:8084}
      stub-enabled: ${LAB_STUB_ENABLED:true}
      # true면 검사오더 발송을 REST 대신 Kafka 이벤트 발행으로 전환 (검사서비스와 합의된 토픽 계약 사용)
      messaging-enabled: ${LAB_MESSAGING_ENABLED:false}
    pharmacy:
      base-url: ${PHARMACY_BASE_URL:http://localhost:8088}
      stub-enabled: ${PHARMACY_STUB_ENABLED:false}
      # true면 약제 토픽 자동생성(PharmacyKafkaConfig) 활성화. REST 대안이 없어서 stub-enabled는 없음
      messaging-enabled: ${PHARMACY_MESSAGING_ENABLED:false}
    reception:
      # true면 접수 토픽 자동생성(ReceptionKafkaConfig) 활성화. RCP는 Kafka로만 통보하므로 REST 대안 없음
      messaging-enabled: ${RECEPTION_MESSAGING_ENABLED:false}
  kafka:
    topics:
      lab-order-requested: opd.lab-order.requested.v1
      lab-order-resulted: lab.lab-order.resulted.v1
      pharmacy-order-requested: opd.pharmacy-order.requested.v1
      reception-registered: outpatient-patient-daily-list
      lab-result-reported: lab.lab-result.reported.v1
    consumer-group: outpatient-service.lab-order-resulted-consumer
    reception-consumer-group: outpatient-service.reception-registered-consumer
    lab-result-consumer-group: outpatient-service.lab-result-reported-consumer

spring:
  application:
    name: outpatient-service
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@seoulit.pe.kr:1521/FREEPDB1}
    username: ${DB_USERNAME:outpatient}
    password: ${DB_PASSWORD:outpatient}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: outpatient-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${app.kafka.consumer-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis:
  mapper-locations: classpath:mapper/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    kr.co.seoulit.his: DEBUG
    org.hibernate.SQL: DEBUG
